<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>septicservice</title>
    <!--
      GitHub Pages has no server-side rewrite support, so it serves this file
      for any unknown path. Encode the requested path into a query string and
      redirect to the app root; index.html decodes it back before the router
      mounts. Adapted from https://github.com/rafgraph/spa-github-pages.
    -->
    <script>
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      )
    </script>
  </head>
  <body></body>
</html>
